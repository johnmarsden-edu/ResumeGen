projects:
  - name: Control Flow Graph Compiler
    highlights:
      - >-
        Implemented a custom intermediate language representation with the
        necessary semantics for converting programs to control flow graphs (CFG)
      - >-
        Created a compiler in <strong>Rust</strong> to convert the custom intermediate language to a 
        statement level control flow graph
      - >-
        Implemented a parallelized <strong>TCP</strong> server on top of the compiler
        to handle over two hundred thousand compilations necessary for
        training a <strong>machine-learning</strong> model
    keywords:
      - Cap'n Proto
      - Pytorch
      - Rust
      - Java
      - Docker
      - Bash
      - FLOSS
      - Machine Learning
      - Research